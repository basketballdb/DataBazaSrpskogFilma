<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Srpska filmska baza — filmovi, serije, glumci</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=Playfair+Display:ital,wght@0,400;0,700;0,800;0,900;1,400;1,700&display=swap" rel="stylesheet">

<style>
:root{
  --paper:#f2ebdc; --paper-2:#e9e0cd; --paper-3:#dcd0b8;
  --ink:#191510; --ink-2:#4a4136; --ink-3:#776c5b;
  --rule:#cdc1a8; --rule-dark:#a89a7d;
  --red:#C6363C; --red-2:#D84349;
  --blue:#0C4076; --blue-2:#0E4C8C;
  --flag-white:#F8F4EB;
  --green:#4c6b39;
  --font-display:'Playfair Display', Georgia, 'Times New Roman', serif;
  --font-body:'Lora', Georgia, 'Times New Roman', serif;
  --font-mono:'IBM Plex Mono', 'Courier New', monospace;
}
*,*::before,*::after{ box-sizing:border-box; margin:0; padding:0; }
html{ scroll-behavior:smooth; }
body{
  font-family:var(--font-body); font-size:16px; color:var(--ink);
  background-color:var(--paper);
  background-image:
    repeating-linear-gradient(0deg, rgba(70,50,20,.018) 0 1px, transparent 1px 3px),
    radial-gradient(circle at 18% 6%, rgba(190,150,80,.16), transparent 52%),
    radial-gradient(circle at 88% 92%, rgba(120,60,40,.09), transparent 48%);
  background-attachment:fixed;
  line-height:1.55; min-height:100vh; -webkit-font-smoothing:antialiased;
}
body::before{
  content:'';
  position:fixed; top:0; left:0; right:0; height:3px;
  background: linear-gradient(to bottom,
    var(--red) 0 1px, var(--blue) 1px 2px, var(--flag-white) 2px 3px);
  z-index:1000; pointer-events:none;
}
a{ color:inherit; text-decoration:none; }
button,input,select,textarea{ font:inherit; color:inherit; }
img{ display:block; max-width:100%; }
::selection{ background:var(--ink); color:var(--paper); }
::-webkit-scrollbar{ width:12px; height:12px; }
::-webkit-scrollbar-track{ background:var(--paper-2); }
::-webkit-scrollbar-thumb{ background:var(--rule-dark); border:3px solid var(--paper-2); }

.masthead{ max-width:1240px; margin:0 auto; padding:0 28px; }
.masthead-top{
  display:flex; align-items:center; justify-content:space-between;
  gap:18px; flex-wrap:wrap; padding:14px 0 10px;
  border-bottom:1px solid var(--rule);
  font-family:var(--font-mono); font-size:9.5px;
  letter-spacing:.2em; text-transform:uppercase; color:var(--ink-3);
}
.mh-left{ display:flex; align-items:center; gap:10px; }
.save-status{
  display:inline-block; width:8px; height:8px; border-radius:50%;
  background:#4caf50; transition:background .2s ease;
  box-shadow: 0 0 0 1px rgba(0,0,0,.15);
}
.save-status.saving{ background:#f0a020; animation: pulse 1s ease infinite; }
.save-status.error{ background:#d92d20; box-shadow: 0 0 0 2px rgba(217,45,32,.25); }
@keyframes pulse{ 0%,100%{opacity:1} 50%{opacity:.4} }
.mh-right{ display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
.logo{
  font-family:var(--font-display); font-weight:900;
  font-size:clamp(34px,7.4vw,82px); line-height:.9;
  letter-spacing:-.025em; text-transform:uppercase;
  text-align:center; padding:22px 0 6px;
}
.logo em{
  font-style:italic; font-weight:400; color:var(--red);
  text-shadow: 2px 2px 0 rgba(12, 64, 118, 0.35);
}
.tagline{
  text-align:center; font-family:var(--font-mono); font-size:9.5px;
  letter-spacing:.46em; text-transform:uppercase; color:var(--ink-2);
  padding-bottom:16px;
}
.tagline .t-red{ color:var(--red); }
.tagline .t-blue{ color:var(--blue); }
.tagline .t-ink{ color:var(--ink-2); }
.tagline .t-sep{ color:var(--ink-3); }
.mainnav{
  display:flex; flex-wrap:wrap; justify-content:center;
  border-top:2px solid var(--ink); border-bottom:2px solid var(--ink);
}
.mainnav a{
  font-family:var(--font-mono); font-size:10.5px;
  letter-spacing:.18em; text-transform:uppercase;
  padding:12px 18px; border-right:1px solid var(--rule);
  transition:background .12s ease, color .12s ease;
}
.mainnav a:last-child{ border-right:none; }
.mainnav a:hover{ background:var(--ink); color:var(--paper); }
.mainnav a.is-active{ background:var(--red); color:#fdf6e9; }

.searchband{ padding: 12px 0 14px; border-bottom: 1px solid var(--ink); }
.searchband-frame{
  display: flex; align-items: center; gap: 12px;
  border: 2px solid var(--ink);
  padding: 9px 14px;
  background: var(--paper-2);
  box-shadow: 4px 4px 0 var(--ink);
  transition: box-shadow .12s ease, transform .12s ease;
}
.searchband-frame:focus-within{
  box-shadow: 5px 5px 0 var(--ink);
  transform: translate(-1px, -1px);
}
.searchband .sb-mark{
  font-family:var(--font-mono); font-size:9.5px;
  letter-spacing:.2em; text-transform:uppercase; color:var(--red);
  flex-shrink:0;
}
.searchband input{
  flex:1; border:none; background:transparent; outline:none;
  font-family:var(--font-body); font-size:15px; font-style:italic;
  color:var(--ink); padding:3px 0;
}
.searchband input::placeholder{ color:var(--ink-3); }
.searchband .sb-go{
  border:1px solid var(--ink); background:var(--paper);
  width:28px; height:26px; display:grid; place-items:center;
  cursor:pointer; font-size:13px; line-height:1;
  flex-shrink:0;
  transition:background .12s ease, color .12s ease;
}
.searchband .sb-go:hover{ background:var(--ink); color:var(--paper); }

.container{ max-width:1240px; margin:0 auto; padding:8px 28px 90px; }

#bannerRoot{ max-width:1240px; margin: 12px auto 0; padding: 0 28px; }
.persistent-banner{
  display:flex; align-items:center; gap:14px;
  padding: 12px 16px;
  background: rgba(217, 45, 32, 0.92);
  color: #fdf6e9;
  border: 2px solid var(--ink);
  box-shadow: 4px 4px 0 var(--ink);
  font-family: var(--font-body);
  font-size: 14px;
  line-height: 1.4;
}
.persistent-banner.info{ background: rgba(12, 64, 118, 0.92); color:#f3f6fa; }
.persistent-banner.warn{ background: rgba(189, 138, 27, 0.94); color: #fdf6e9; }
.persistent-banner .banner-text{ flex:1; }
.persistent-banner .btn{ flex-shrink:0; background: var(--paper); color: var(--ink); border-color: var(--ink); }

.page-head{
  display:flex; align-items:flex-end; justify-content:space-between;
  gap:20px; flex-wrap:wrap;
  border-bottom:2px solid var(--ink);
  padding:34px 0 14px; margin-bottom:28px;
  position:relative;
}
.page-head::after{
  content:''; position:absolute; left:0; right:0; bottom:-4px; height:2px;
  background: linear-gradient(to right,
    var(--red) 0 33.33%, var(--flag-white) 33.33% 66.66%, var(--blue) 66.66% 100%);
  pointer-events:none;
}
.page-head h1{
  font-family:var(--font-display);
  font-size:clamp(28px,4.4vw,46px);
  font-weight:800; letter-spacing:-.02em; line-height:1.02;
}
.page-head .sub{
  font-family:var(--font-mono); font-size:10px;
  letter-spacing:.18em; text-transform:uppercase;
  color:var(--ink-3); margin-top:8px;
}
.page-head .sub b{ color:var(--red); }

.kicker{
  font-family:var(--font-mono); font-size:11px;
  letter-spacing:.24em; text-transform:uppercase;
  color:var(--red); margin-bottom:8px;
}
.lede{ font-size:15px; line-height:1.7; color:var(--ink-2); max-width:64ch; }

.sec-head{
  display:flex; align-items:baseline; gap:14px;
  border-bottom:2px solid var(--ink);
  padding-bottom:8px; margin:50px 0 24px;
}
.sec-num{
  font-family:var(--font-mono); font-size:10px;
  letter-spacing:.18em; color:var(--red); flex-shrink:0;
}
.sec-head h2{
  font-family:var(--font-display);
  font-size:clamp(21px,2.9vw,30px);
  font-weight:700; letter-spacing:-.015em;
  line-height:1; flex-shrink:0;
}
.sec-line{
  flex:1; height:1px;
  background: linear-gradient(90deg,
    rgba(198, 54, 60, 0.55) 0%, rgba(12, 64, 118, 0.45) 100%);
  align-self:center; min-width:20px;
}
.sec-meta{
  font-family:var(--font-mono); font-size:9.5px;
  letter-spacing:.16em; text-transform:uppercase;
  color:var(--ink-3); flex-shrink:0;
}

.hero-numbers{
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  border-top: 3px double var(--ink);
  border-bottom: 3px double var(--ink);
  margin: 30px 0 10px;
}
.hero-num{
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 36px 20px 32px;
  transition: background .12s ease;
  position: relative;
}
.hero-num + .hero-num{ border-left: 1px solid var(--rule); }
.hero-num:hover{ background: rgba(0,0,0,.035); }
.hero-num b{
  font-family: var(--font-display);
  font-size: clamp(48px, 8vw, 96px);
  font-weight: 900; line-height: 1;
  letter-spacing: -.04em;
  color: var(--ink);
}
.hero-num:nth-child(1) b{ color: var(--red); }
.hero-num:nth-child(2) b{ color: var(--blue); }
.hero-num:nth-child(3) b{ color: var(--ink); }
.hero-num span{
  font-family: var(--font-mono); font-size: 11px;
  letter-spacing: .32em; text-transform: uppercase;
  color: var(--ink-2); margin-top: 14px;
  font-weight: 600;
}

.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  font-family:var(--font-mono); font-size:10px;
  letter-spacing:.16em; text-transform:uppercase; line-height:1;
  padding:10px 15px; border:2px solid var(--ink); background:var(--paper);
  color:var(--ink); box-shadow:3px 3px 0 var(--ink); cursor:pointer;
  transition:transform .1s ease, box-shadow .1s ease, background .12s ease, color .12s ease;
  user-select:none; white-space:nowrap;
}
.btn:hover{ transform:translate(-1px,-1px); box-shadow:5px 5px 0 var(--ink); }
.btn:active{ transform:translate(3px,3px); box-shadow:0 0 0 var(--ink); }
.btn:disabled{ opacity:.55; cursor:not-allowed; transform:none; box-shadow:3px 3px 0 var(--ink); }
.btn.solid{ background:var(--red); color:#fdf6e9; }
.btn.solid:hover{ background:var(--red-2); }
.btn.ink{ background:var(--ink); color:var(--paper); }
.btn.blue{ background:var(--blue); color:#f3f6fa; }
.btn.blue:hover{ background:var(--blue-2); }
.btn.outline-red{ border-color:var(--red); color:var(--red); box-shadow:3px 3px 0 var(--red); }
.btn.tiny{
  padding:6px 10px; font-size:9px; letter-spacing:.14em;
  border-width:1px; box-shadow:2px 2px 0 var(--ink);
}
.btn.tiny:hover{ transform:translate(-1px,-1px); box-shadow:3px 3px 0 var(--ink); }
.btn.bare{
  border-color:transparent; background:transparent; box-shadow:none;
  padding:4px 8px; color:var(--ink-2);
}
.btn.bare:hover{ background:var(--ink); color:var(--paper); transform:none; box-shadow:none; }
.btn-row{ display:flex; gap:12px; flex-wrap:wrap; align-items:center; }

.field{ display:block; margin-bottom:20px; }
.field > .lab{
  display:block; font-family:var(--font-mono); font-size:9px;
  letter-spacing:.2em; text-transform:uppercase;
  color:var(--ink-3); margin-bottom:5px;
}
.inp, .sel, .area{
  width:100%; background:transparent; border:none;
  border-bottom:2px solid var(--ink);
  padding:7px 2px; outline:none; font-family:var(--font-body);
  font-size:15px; color:var(--ink);
  transition:border-color .12s ease, background .12s ease;
}
.inp:focus, .sel:focus, .area:focus{
  border-bottom-color:var(--red); background:rgba(255,255,255,.35);
}
.area{ resize:vertical; min-height:88px; line-height:1.55; font-size:14px; }
.sel{ cursor:pointer; appearance:none; padding-right:18px; }
.sel option{ background:var(--paper); color:var(--ink); }
.hint{
  font-family:var(--font-mono); font-size:9px;
  letter-spacing:.08em; color:var(--ink-3);
  margin-top:6px; text-transform:uppercase;
}
.row-2{ display:grid; grid-template-columns:1fr 1fr; gap:22px; }
.row-3{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:22px; }

.img-field{ margin-bottom:22px; }
.img-field > .lab{
  display:block; font-family:var(--font-mono); font-size:9px;
  letter-spacing:.2em; text-transform:uppercase;
  color:var(--ink-3); margin-bottom:8px;
}
.img-picker{ display:flex; gap:16px; align-items:flex-start; flex-wrap:wrap; }
.img-preview{
  width:100px; height:150px; border:2px solid var(--ink);
  background:var(--paper-2) center/cover; box-shadow:3px 3px 0 var(--ink);
  flex-shrink:0; position:relative;
}
.img-preview::after{
  content:"bez slike"; position:absolute; inset:0;
  display:grid; place-items:center; font-family:var(--font-mono);
  font-size:8px; letter-spacing:.14em; text-transform:uppercase;
  color:var(--ink-3);
}
.img-preview.has-img::after{ display:none; }
.img-picker-actions{ display:flex; flex-direction:column; gap:8px; flex:1 1 200px; }
.img-picker-actions .hint{ margin-top:0; }

.cast-editor{ display:flex; flex-direction:column; gap:8px; }
.cast-item{
  display:grid; grid-template-columns: 1.4fr 1fr 32px;
  gap:8px; align-items:center;
  padding:8px; border:1px solid var(--rule);
  background:rgba(255,255,255,.3);
}
.cast-item.is-series{
  grid-template-columns: 1.3fr 1fr 1.1fr 0.8fr 32px;
}
.cast-item .inp{ font-size:13px; padding:4px 2px; }
.cast-item .btn.bare{ padding:4px; }

.seasons-editor{ display:flex; flex-direction:column; gap:12px; }
.season-block{
  border:1px solid var(--rule-dark); padding:10px;
  background:rgba(255,255,255,.3);
}
.season-head{
  display:flex; align-items:center; gap:10px;
  padding-bottom:8px; margin-bottom:8px;
  border-bottom:1px dashed var(--rule);
}
.season-head .season-label{
  font-family:var(--font-mono); font-size:9px;
  letter-spacing:.18em; text-transform:uppercase;
  color:var(--ink-2);
}
.season-head .season-num{
  width:60px; padding:3px 6px; border:1px solid var(--ink);
  background:var(--paper); font-family:var(--font-mono); font-size:12px;
}
.season-head .spacer{ flex:1; }
.episodes-list{ display:flex; flex-direction:column; gap:6px; margin-bottom:8px; }
.episode-row{
  display:grid; grid-template-columns: 44px 1fr 2fr 130px 28px;
  gap:6px; align-items:center;
}
.episode-row .ep-num{
  width:100%; padding:3px 6px; border:1px solid var(--ink);
  background:var(--paper); font-family:var(--font-mono); font-size:11px;
  text-align:center;
}
.episode-row .ep-title, .episode-row .ep-airdate{
  width:100%; padding:3px 6px; border:1px solid var(--ink);
  background:var(--paper); font-size:12px; font-family:var(--font-body);
}
.episode-row .ep-airdate{ font-family:var(--font-mono); font-size:11px; }
.episode-row .btn.bare{ padding:2px; }

.filters{
  display:flex; gap:26px; flex-wrap:wrap; align-items:flex-end;
  border-top:2px solid var(--ink); border-bottom:1px solid var(--rule);
  padding:14px 0 12px; margin-bottom:30px;
}
.filters .f-field{ flex:1 1 170px; min-width:140px; }
.filters .f-field.wide{ flex:2 1 260px; }
.filters .f-field .lab{
  display:block; font-family:var(--font-mono); font-size:8.5px;
  letter-spacing:.22em; text-transform:uppercase;
  color:var(--ink-3); margin-bottom:4px;
}
.filters .inp, .filters .sel{ border-bottom-width:1px; font-size:14px; padding:4px 0; }

.grid{
  display:grid; grid-template-columns:repeat(auto-fill, minmax(196px, 1fr));
  gap:30px 22px;
}
.grid.people{
  grid-template-columns:repeat(auto-fill, minmax(168px, 1fr));
  gap:28px 20px;
}
.tcard{
  display:flex; flex-direction:column;
  border:2px solid var(--ink); background:var(--paper);
  box-shadow:4px 4px 0 var(--ink);
  transition:transform .13s ease, box-shadow .13s ease;
}
.tcard:hover{ transform:translate(-2px,-2px); box-shadow:8px 8px 0 var(--ink); }
.tcard:active{ transform:translate(2px,2px); box-shadow:1px 1px 0 var(--ink); }
.tcard-poster{
  position:relative; aspect-ratio:2/3; display:grid; place-items:center;
  overflow:hidden; border-bottom:2px solid var(--ink);
  background:
    linear-gradient(158deg,
      hsl(var(--h) 44% 44%) 0%,
      hsl(var(--h) 52% 26%) 55%,
      hsl(var(--h) 60% 15%) 100%) center/cover;
}
.tcard-poster::after{
  content:""; position:absolute; inset:0;
  background-image:radial-gradient(rgba(0,0,0,.4) 1px, transparent 1.3px);
  background-size:4px 4px; opacity:.5; mix-blend-mode:multiply;
  pointer-events:none;
}
.tcard-poster.has-image::after{ opacity:0; }
.tcard-poster.has-image .ini{ display:none; }
.tcard-poster .ini{
  position:relative; z-index:1; font-family:var(--font-display);
  font-weight:900; font-size:3.1rem; letter-spacing:-.02em;
  line-height:1; color:#f7f0e1;
  text-shadow:2px 2px 0 rgba(0,0,0,.35);
  text-align:center; padding:0 8px;
}
.stamp{
  position:absolute; top:8px; left:8px; z-index:2;
  font-family:var(--font-mono); font-size:8.5px;
  letter-spacing:.16em; text-transform:uppercase;
  padding:2px 6px; background:var(--paper);
  color:var(--ink); border:1px solid var(--ink);
  transform:rotate(-3deg);
}
.stamp.series{ background:var(--blue); color:#eef3f8; border-color:var(--blue); }
.tcard-body{ padding:11px 11px 13px; display:flex; flex-direction:column; gap:3px; flex:1; }
.tcard-body h3{
  font-family:var(--font-display); font-size:15px;
  font-weight:700; line-height:1.18; letter-spacing:-.005em;
}
.tcard-year{
  font-family:var(--font-mono); font-size:13px;
  letter-spacing:.1em; color:var(--ink-2); text-transform:uppercase;
  font-weight:600;
}
.tcard-genres{
  font-size:12.5px; font-style:italic;
  color:var(--ink-2); line-height:1.35;
}
.tcard-rating{
  margin-top:auto; padding-top:7px;
  font-family:var(--font-mono); font-size:10.5px;
  letter-spacing:.1em; color:var(--red);
}

.pcard{ display:flex; flex-direction:column; gap:9px; transition:transform .13s ease; }
.pcard:hover{ transform:translateY(-3px); }
.pcard-portrait{
  position:relative; aspect-ratio:1/1;
  display:grid; place-items:center;
  border:2px solid var(--ink);
  background:
    linear-gradient(150deg,
      hsl(var(--h) 34% 52%) 0%,
      hsl(var(--h) 38% 32%) 60%,
      hsl(var(--h) 42% 22%) 100%) center/cover;
  box-shadow:4px 4px 0 var(--ink); overflow:hidden;
  transition:box-shadow .13s ease;
}
.pcard:hover .pcard-portrait{ box-shadow:7px 7px 0 var(--ink); }
.pcard-portrait::after{
  content:""; position:absolute; inset:0;
  background-image:radial-gradient(rgba(0,0,0,.35) 1px, transparent 1.2px);
  background-size:5px 5px; opacity:.45; mix-blend-mode:multiply;
  pointer-events:none;
}
.pcard-portrait.has-image::after{ opacity:0; }
.pcard-portrait.has-image span{ display:none; }
.pcard-portrait span{
  position:relative; z-index:1; font-family:var(--font-display);
  font-size:2rem; font-weight:900; letter-spacing:-.02em;
  color:#f7f0e1; text-shadow:2px 2px 0 rgba(0,0,0,.3);
}
.pcard-name{
  font-family:var(--font-display); font-size:15px;
  font-weight:700; line-height:1.2;
}
.pcard-count{
  font-family:var(--font-mono); font-size:9px;
  letter-spacing:.12em; text-transform:uppercase;
  color:var(--red); border-top:1px solid var(--rule);
  padding-top:6px;
}

.title-hero{
  display:grid; grid-template-columns:232px 1fr;
  gap:40px; border-bottom:3px double var(--ink);
  padding:34px 0 32px;
}
.title-hero.with-seasons{
  grid-template-columns: 200px 1fr 300px;
  gap: 32px;
}
.th-poster{
  position:relative; aspect-ratio:2/3;
  border:2px solid var(--ink); box-shadow:7px 7px 0 var(--ink);
  display:grid; place-items:center; overflow:hidden;
  background:linear-gradient(158deg, hsl(var(--h) 44% 42%), hsl(var(--h) 58% 14%)) center/cover;
}
.th-poster::after{
  content:""; position:absolute; inset:0;
  background-image:radial-gradient(rgba(0,0,0,.42) 1px, transparent 1.3px);
  background-size:4px 4px; opacity:.55; mix-blend-mode:multiply;
  pointer-events:none;
}
.th-poster.has-image::after{ opacity:0; }

<script>
/* ============================================================
   1. UTIL
   ============================================================ */
function esc(v){
  if (v === null || v === undefined) return '';
  return String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function initials(text){
  if (!text) return '?';
  const w = String(text).trim().split(/\s+/).filter(Boolean);
  if (!w.length) return '?';
  if (w.length === 1) return w[0].slice(0,2).toUpperCase();
  return (w[0][0] + w[w.length-1][0]).toUpperCase();
}
function hueFor(text){
  let h=0; const s=String(text||'');
  for (let i=0;i<s.length;i++) h = (h*31 + s.charCodeAt(i)) % 360;
  return h;
}
function num(v, fb){ const n = parseFloat(v); return isNaN(n) ? fb : n; }
function pluralUloga(n){
  const a=n%10,b=n%100;
  if (a===1&&b!==11) return 'uloga';
  if (a>=2&&a<=4&&(b<12||b>14)) return 'uloge';
  return 'uloga';
}
function pluralNaslov(n){
  const a=n%10,b=n%100;
  if (a===1&&b!==11) return 'naslov';
  if (a>=2&&a<=4&&(b<12||b>14)) return 'naslova';
  return 'naslova';
}

function yearsLabel(t){

  return String(t.year);
}
function fmtDate(iso){

function fmtBytes(b){
  if (!b || b < 1024) return (b || 0) + ' B';
  if (b < 1024*1024) return (b/1024).toFixed(1) + ' KB';
  if (b < 1024*1024*1024) return (b/1024/1024).toFixed(2) + ' MB';
  return (b/1024/1024/1024).toFixed(2) + ' GB';
}
function creditYearsLabel(c){
  const title = c.title;
  if (title.type !== 'series') return yearsLabel(title);
  if (!c.seasons || !c.seasons.length) return yearsLabel(title);
  const airdates = [];
  (title.seasons || []).forEach(s => {
    if (c.seasons.includes(s.number)){
      (s.episodes || []).forEach(e => { if (e.airdate) airdates.push(e.airdate); });
    }
  });
  if (airdates.length){
    airdates.sort();
    const minYear = airdates[0].slice(0, 4);
    const maxYear = airdates[airdates.length - 1].slice(0, 4);
    return minYear === maxYear ? minYear : minYear + '–' + maxYear;
  }
  const sorted = [...c.seasons].sort((a, b) => a - b);
  if (sorted.length === 1) return 'Sezona ' + sorted[0];
  return 'Sezone ' + sorted[0] + '–' + sorted[sorted.length - 1];
}

/* NEW: Calculate age at death */
function getAgeAtDeath(birthDateStr, deathDateStr){
  if (!birthDateStr || !deathDateStr) return null;
  const bd = String(birthDateStr).split('-');
  const dd = String(deathDateStr).split('-');
  if (bd.length === 3 && dd.length === 3) {
    const bYear = parseInt(bd[0], 10);
    const bMonth = parseInt(bd[1], 10);
    const bDay = parseInt(bd[2], 10);
    const dYear = parseInt(dd[0], 10);
    const dMonth = parseInt(dd[1], 10);
    const dDay = parseInt(dd[2], 10);
    if (isNaN(bYear) || isNaN(dYear)) return null;
    let age = dYear - bYear;
    if (dMonth < bMonth || (dMonth === bMonth && dDay < bDay)) {
      age--;
    }
    return age > 0 ? age : null;
  }
  return null;
}

function parseSeasons(str){
  return String(str || '')
    .split(',')
    .map(s => {
      const head = s.split(':')[0].trim();
      return parseInt(head, 10);
    })
    .filter(n => !isNaN(n) && n > 0)
    .filter((v, i, arr) => arr.indexOf(v) === i);
}

function getExplicitTotalEpisodes(castEntry){
  if (!castEntry) return null;
  if (castEntry.totalEpisodes !== undefined && castEntry.totalEpisodes !== null && castEntry.totalEpisodes !== ''){
    const n = parseInt(castEntry.totalEpisodes, 10);
    if (!isNaN(n) && n >= 0) return n;
  }
  if (castEntry.seasonEpisodes && Object.keys(castEntry.seasonEpisodes).length){
    const sum = Object.values(castEntry.seasonEpisodes)
      .reduce((acc, v) => acc + (Number(v) || 0), 0);
    if (sum > 0) return sum;
  }
  return null;
}

function computeCastEpisodes(c, title){
  if (!title || title.type !== 'series') return 0;
  const explicit = getExplicitTotalEpisodes(c);
  if (explicit !== null) return explicit;
  const castSeasons = c.seasons || [];
  if (!castSeasons.length){
    return (title.seasons || []).reduce((sum, s) => sum + (s.episodes||[]).length, 0);
  }
  let count = 0;
  (title.seasons || []).forEach(s => {
    if (castSeasons.includes(s.number)){
      count += (s.episodes || []).length;
    }
  });
  return count;
}

let __dbPromise = null;

function getDB(){
  if (__dbPromise) return __dbPromise;
  __dbPromise = new Promise((resolve, reject) => {
    if (!window.indexedDB){ reject(new Error('IndexedDB nije dostupan u ovom pregledaču.')); return; }
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = () => {
      const idb = req.result;
      if (!idb.objectStoreNames.contains(STORE_KV)) idb.createObjectStore(STORE_KV, { keyPath: 'key' });
      if (!idb.objectStoreNames.contains(STORE_IMAGES)) idb.createObjectStore(STORE_IMAGES, { keyPath: 'key' });
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
    req.onblocked = () => reject(new Error('IndexedDB je blokiran u drugoj kartici. Zatvorite ostale kartice ove baze.'));
  });
  return __dbPromise;
}

async function idbGet(store, key){
  const idb = await getDB();
  return new Promise((res, rej) => {
    const tx = idb.transaction(store, 'readonly');
    const req = tx.objectStore(store).get(key);
    req.onsuccess = () => res(req.result || null);
    req.onerror = () => rej(req.error);
  });
}
async function idbPut(store, record){
  const idb = await getDB();
  return new Promise((res, rej) => {
    const tx = idb.transaction(store, 'readwrite');
    tx.objectStore(store).put(record);
    tx.oncomplete = () => res();
    tx.onerror = () => rej(tx.error);
    tx.onabort = () => rej(tx.error || new Error('Transakcija prekinuta'));
  });
}
async function idbDelete(store, key){
  const idb = await getDB();
  return new Promise((res, rej) => {
    const tx = idb.transaction(store, 'readwrite');
    tx.objectStore(store).delete(key);
    tx.oncomplete = () => res();
    tx.onerror = () => rej(tx.error);
  });
}
async function idbClear(store){
  const idb = await getDB();
  return new Promise((res, rej) => {
    const tx = idb.transaction(store, 'readwrite');
    tx.objectStore(store).clear();
    tx.oncomplete = () => res();
    tx.onerror = () => rej(tx.error);
  });
}

function loadImageFromFile(file){
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => { URL.revokeObjectURL(url); resolve(img); };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Ne mogu da učitam sliku')); };
    img.src = url;
  });
}
function canvasToBlob(canvas, mime, quality){
  return new Promise((resolve) => {
    try { canvas.toBlob(b => resolve(b), mime, quality); }
    catch(e){ resolve(null); }
  });
}
async function compressImage(file, opts){
  const { maxDim = 480, quality = 0.72, targetKB = 55 } = opts || {};
  if (!file || !file.type || !file.type.startsWith('image/')){
    throw new Error('Nije slika.');
  }
  const img = await loadImageFromFile(file);
  let { width, height } = img;
  if (width > maxDim || height > maxDim){
    if (width >= height){
      height = Math.round(height * maxDim / width); width = maxDim;
    } else {
      width = Math.round(width * maxDim / height); height = maxDim;
    }
  }
  const canvas = document.createElement('canvas');
  canvas.width = width; canvas.height = height;
  const ctx = canvas.getContext('2d');
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';
  ctx.fillStyle = '#f2ebdc';
  ctx.fillRect(0, 0, width, height);
  ctx.drawImage(img, 0, 0, width, height);

  const targetBytes = targetKB * 1024;
  let blob = await canvasToBlob(canvas, 'image/webp', quality);
  let mimeUsed = 'image/webp';
  if (!blob){
    blob = await canvasToBlob(canvas, 'image/jpeg', quality);
    mimeUsed = 'image/jpeg';
    if (!blob) throw new Error('Kompresija neuspešna.');
  }
  let q = quality;
  let attempts = 0;
  while (blob.size > targetBytes && attempts < 5 && q > 0.4){
    q -= 0.1;
    const next = await canvasToBlob(canvas, mimeUsed, q);
    if (next && next.size < blob.size) blob = next;
    attempts++;
  }
  return blob;
}

function invalidateImageURL(key){

async function getImageURL(key){
  if (imageURLs.has(key)) return imageURLs.get(key).url;
  const blob = await getImage(key);
  if (!blob) return null;
  const url = URL.createObjectURL(blob);

  knownImageKeys.add(key);
  return url;
}

              }catch(e){ /* skip individual */ }
            }
            try { oldDB.close(); } catch(e){}
            resolve(counted);
          };
          keysReq.onerror = () => { try{ oldDB.close(); }catch(e){} resolve(counted); };
        }catch(e){
          try { oldDB.close(); }catch(e2){}
          resolve(0);
        }
      };
      req.onerror = () => resolve(0);
    }catch(e){ resolve(0); }
  });

async function resolvePeople(names, defaultOccupation){
  const ids = [];
  const created = [];
  
  for (const rawName of names) {
    const name = String(rawName || '').trim();
    if (!name) continue;

    const existing = db.people.find(p => p.name.toLowerCase() === name.toLowerCase());

    if (existing) {
      const choice = await promptDuplicateChoice(name);
      if (choice === 'existing') {
        ids.push(existing.id);
        continue;
      }
    }

    // Create new (either because no duplicate, or user chose 'new')
    let uniqueName = name;
    let counter = 1;
    while (db.people.some(p => p.name.toLowerCase() === uniqueName.toLowerCase())) {
      counter++;
      uniqueName = name + ' (' + counter + ')';
    }

    const newPerson = {
      id: db.meta.nextPersonId++,
      name: uniqueName,
      birthDate: '', birthPlace: '',
      deathDate: '', deathPlace: '',
      occupations: defaultOccupation ? [defaultOccupation] : [],
      bio: ''
    };
    db.people.push(newPerson);
    ids.push(newPerson.id);
    created.push(uniqueName);
  }
  
  return { ids, created };
}

function parsePath(path){
  const raw = String(path || '/').replace(/^#/, '');
  const qi = raw.indexOf('?');
  const clean = qi === -1 ? raw : raw.slice(0, qi);
  const qs = qi === -1 ? '' : raw.slice(qi + 1);
  return { segments: clean.split('/').filter(Boolean), params: new URLSearchParams(qs) };
}
function go(path){

  renderPath(path);

  currentRoute = parsePath(path);

}
window.addEventListener('hashchange', () => renderPath(location.hash.replace(/^#/, '') || '/'));
window.addEventListener('popstate', () => renderPath(location.hash.replace(/^#/, '') || '/'));

/* ============================================================
   7. RENDER
   ============================================================ */
function render(){
  const root = currentRoute.segments[0] || 'home';
  const view = document.getElementById('view');
  let html = '';
  switch(root){
    case 'home':    html = viewHome(); break;
    case 'films':   html = viewList('film'); break;
    case 'series':  html = viewList('series'); break;
    case 'people':  html = viewPeople(); break;
    case 'person':  html = viewPerson(currentRoute.segments[1]); break;
    case 'title':   html = viewTitle(currentRoute.segments[1]); break;
    case 'search':  html = viewSearch(currentRoute.params.get('q') || ''); break;
    case 'stats':   html = viewStats(); break;
    case 'about':   html = viewAbout(); break;
    default:        html = notFound('Stranica nije pronađena', 'Tražena ruta ne postoji u arhivi.');
  }
  view.innerHTML = html;
  updateNav(root);
  attachListeners();
  applyImages(view);

  if (root === 'about'){
    setTimeout(async () => {
      const el = document.getElementById('storageInfo');
      if (!el) return;
      const stats = await getImageStats();
      const textSize = new Blob([JSON.stringify(db)]).size;
      const totalAppSize = stats.size + textSize;
      el.innerHTML = `
        <div class="ledger-row"><div><div class="l-name">Tekstualni podaci</div></div><div class="l-count">${fmtBytes(textSize)}</div></div>
        <div class="ledger-row"><div><div class="l-name">Slike (${stats.count} komada)</div></div><div class="l-count">${fmtBytes(stats.size)}</div></div>
        <div class="ledger-row" style="background:rgba(0,0,0,.05); font-weight:bold;"><div><div class="l-name">UKUPNO ZA OVU BAZU</div></div><div class="l-count" style="color:var(--ink);">${fmtBytes(totalAppSize)}</div></div>
      `;
    }, 10);
  }
  try{ window.scrollTo(0,0); }catch(e){}
}

function updateNav(root){
  const map = { home:'home', films:'films', series:'series', people:'people', person:'people', stats:'stats', about:'about', title:'', search:'' };
  const active = map[root] || '';
  document.querySelectorAll('.mainnav a[data-route]').forEach(a => {
    a.classList.toggle('is-active', a.dataset.route === active);
  });
}

function titleCard(t){
  const h = hueFor(t.title);
  const stamp = t.type === 'film'
    ? '<span class="stamp">Film</span>'
    : '<span class="stamp series">Serija</span>';
  const genres = (t.genres || []).slice(0,3).join(' / ') || '&nbsp;';
  const rating = t.rating ? '&#9733; ' + Number(t.rating).toFixed(1) : '&#9733; —';
  return `
    <a class="tcard" href="#/title/${t.id}">
      <div class="tcard-poster" data-img-key="title_${t.id}" style="--h:${h}">
        ${stamp}
        <span class="ini">${esc(initials(t.title))}</span>
      </div>
      <div class="tcard-body">
        <h3>${esc(t.title)}</h3>
        <div class="tcard-year">${esc(yearsLabel(t))}</div>
        <div class="tcard-genres">${esc(genres)}</div>
        <div class="tcard-rating">${rating}</div>

function personCard(p){
  const h = hueFor(p.name);
  const occ = (p.occupations || []).slice(0,2).join(' · ') || 'Zanimanje nije uneto';
  return `
    <a class="pcard" href="#/person/${p.id}">
      <div class="pcard-portrait" data-img-key="person_${p.id}" style="--h:${h}">
        <span>${esc(initials(p.name))}</span>
      </div>
      <div class="pcard-name">${esc(p.name)}</div>
      <div class="pcard-count">${esc(occ)}</div>
    </a>`;

function emptyBlock(mark, title, text, actionHtml){
  return `
    <div class="empty">
      <div class="e-mark">${mark}</div>
      <h3>${esc(title)}</h3>
      <p>${esc(text)}</p>

}
function secHead(num, title, meta){
  return `
    <div class="sec-head">
      <span class="sec-num">${num}</span>

      <span class="sec-line"></span>

function notFound(title, text){
  return `<div style="padding:70px 0">${emptyBlock('&#10005;', title, text, '<a class="btn" href="#/">Nazad na početnu</a>')}</div>`;
}

function renderTitleGrid(){
  const type = ui.listType;
  const state = type === 'film' ? ui.films : ui.series;
  const grid = document.getElementById('listGrid');
  if (!grid) return;
  let items = db.titles.filter(t => t.type === type);
  if (state.query){
    const q = state.query.toLowerCase();
    items = items.filter(t => {
      const directorsNames = (t.directors||[]).map(id => getPerson(id)?.name || '').join(' ');
      const screenwritersNames = (t.screenwriters||[]).map(id => getPerson(id)?.name || '').join(' ');
      const castNames = (t.cast||[]).map(c => getPerson(c.personId)?.name || '').join(' ');
      const hay = [t.title, directorsNames, screenwritersNames, castNames, (t.genres||[]).join(' '), t.synopsis].join(' ').toLowerCase();
      return hay.indexOf(q) !== -1;
    });
  }
  if (state.genre){
    items = items.filter(t => (t.genres||[]).indexOf(state.genre) !== -1);
  }
  switch (state.sort){
    case 'year-asc':    items.sort((a,b) => (a.year||0)-(b.year||0)); break;
    case 'rating-desc': items.sort((a,b) => (b.rating||0)-(a.rating||0)); break;
    case 'title-asc':   items.sort((a,b) => a.title.localeCompare(b.title,'sr')); break;
    default:            items.sort((a,b) => (b.year||0)-(a.year||0));
  }
  if (!items.length){
    grid.innerHTML = emptyBlock('&#9671;', 'Nema rezultata', 'Nijedan naslov ne odgovara zadatim filterima.',
      `<button class="btn solid" data-action="title-new" data-type="${type}">+ Dodaj naslov</button>`);
    return;
  }
  grid.innerHTML = items.map(titleCard).join('');
  applyImages(grid);
}

function renderPeopleGrid(){
  const grid = document.getElementById('peopleGrid');
  if (!grid) return;
  let items = db.people.slice();
  if (ui.people.query){
    const q = ui.people.query.toLowerCase();
    items = items.filter(p => (p.name + ' ' + (p.birthPlace||'') + ' ' + (p.occupations||[]).join(' ')).toLowerCase().indexOf(q) !== -1);
  }
  switch (ui.people.sort){
    case 'name-desc':    items.sort((a,b) => b.name.localeCompare(a.name,'sr')); break;
    case 'credits-desc': items.sort((a,b) => {
      const fa = filmographyFor(a.id), fb = filmographyFor(b.id);
      return (fb.acting.length+fb.directing.length+fb.writing.length) - (fa.acting.length+fa.directing.length+fa.writing.length);
    }); break;
    case 'birth-asc':    items.sort((a,b) => (a.birthDate||'9999').localeCompare(b.birthDate||'9999')); break;
    default:             items.sort((a,b) => a.name.localeCompare(b.name,'sr'));
  }
  if (!items.length){
    grid.innerHTML = emptyBlock('&#9671;', 'Nema osoba', 'Nijedna osoba ne odgovara zadatim filterima.',
      '<button class="btn solid" data-action="person-new">+ Dodaj osobu</button>');
    return;
  }
  grid.innerHTML = items.map(personCard).join('');
  applyImages(grid);
}

/* ============================================================
   11. PERSON DETAIL
   ============================================================ */
function viewPerson(id){
  const p = getPerson(id);
  if (!p) return notFound('Osoba nije pronađena', 'Tražena osoba ne postoji u arhivi.');
  const filmo = filmographyFor(p.id);
  const total = filmo.acting.length + filmo.directing.length + filmo.writing.length;

  const occChips = (p.occupations || []).map(o =>
    `<span class="occ-chip accent">${esc(o)}</span>`).join('') || '<span class="occ-chip">Zanimanje nije uneto</span>';

  const facts = [];
  facts.push(`<div class="fact"><dt>Zapisa u bazi</dt><dd>${total}</dd></div>`);

  const isDeceased = !!(p.deathDate || p.deathPlace);
  
  let ageStr = '';
  if (p.deathDate && p.birthDate) {
      const age = getAgeAtDeath(p.birthDate, p.deathDate);
      if (age !== null) ageStr = ' (' + age + ')';
  }
  const nameHtml = esc(p.name) + (isDeceased ? `<span class="dagger">&dagger;${ageStr}</span>` : '');

  /* NEW: Build the life dates string */
  const birthParts = [];
  if (p.birthDate) birthParts.push(fmtDate(p.birthDate));
  if (p.birthPlace) birthParts.push(p.birthPlace);
  const birthStr = birthParts.join(' - ');

  const deathParts = [];
  if (p.deathDate) deathParts.push(fmtDate(p.deathDate));
  if (p.deathPlace) deathParts.push(p.deathPlace);
  const deathStr = deathParts.join(' - ');

  const lifeDatesHtml = (birthStr || deathStr) ? `
    <div class="life-dates">
      ${birthStr ? `<div class="life-line"><span class="life-sym">*</span> ${esc(birthStr)}</div>` : ''}
      ${deathStr ? `<div class="life-line"><span class="life-sym">†</span> ${esc(deathStr)}</div>` : ''}
    </div>
  ` : '';

  const creditRow = c => {
    const isSeries = c.title.type === 'series';
    const epCount = isSeries ? computeCastEpisodes(c, c.title) : 0;
    const epHtml = (isSeries && epCount > 0) ? `<div class="cr-episodes">${epCount} ${pluralEpizoda(epCount)}</div>` : '';
    return `
      <div class="credit-row">
        <div class="cr-year">${esc(creditYearsLabel(c))}</div>
        <div class="cr-main">
          <a href="#/title/${c.title.id}">${esc(c.title.title)}</a>
          ${c.character ? `<span class="cr-char">kao <b>${esc(c.character)}</b></span>` : ''}
        </div>
        ${epHtml}
      </div>`;
  };

  const simpleRow = c => `
    <div class="credit-row">
      <div class="cr-year">${esc(yearsLabel(c.title))}</div>
      <div class="cr-main">
        <a href="#/title/${c.title.id}">${esc(c.title.title)}</a>
        <span class="cr-char">${c.title.type === 'film' ? 'film' : 'serija'}</span>
      </div>
    </div>`;

  return `
    <div class="profile">
      <div class="profile-portrait" data-img-key="person_${p.id}" style="--h:${hueFor(p.name)}">
        <span>${esc(initials(p.name))}</span>
      </div>
      <div class="profile-body">
        <div class="kicker">Osoba u arhivi</div>
        <h1>${nameHtml}</h1>
        <div class="occ-chips">${occChips}</div>
        ${lifeDatesHtml}
        ${p.bio ? `<p class="lede" style="margin-bottom:16px">${esc(p.bio)}</p>` : ''}
        <div class="facts">${facts.join('')}</div>
        <div class="btn-row">
          <button class="btn" data-action="person-edit" data-id="${p.id}">Uredi osobu</button>
          <button class="btn blue" data-action="credit-add-person" data-id="${p.id}">+ Dodaj ulogu</button>
          <button class="btn outline-red" data-action="person-delete" data-id="${p.id}">Obriši</button>
        </div>
      </div>
    </div>

    ${total === 0
      ? emptyBlock('&#9671;', 'Nema zabeleženih radova', 'Ova osoba još nije povezana ni sa jednim naslovom.',
          `<button class="btn blue" data-action="credit-add-person" data-id="${p.id}">+ Dodaj ulogu</button>`)
      : ''}

    ${filmo.acting.length ? `
      ${secHead('01', 'Glumačke uloge', filmo.acting.length + ' ' + pluralUloga(filmo.acting.length))}
      <div class="rows">${filmo.acting.map(creditRow).join('')}</div>
    ` : ''}

    ${filmo.directing.length ? `
      ${secHead('02', 'Rediteljski radovi', filmo.directing.length + ' ' + pluralNaslov(filmo.directing.length))}
      <div class="rows">${filmo.directing.map(simpleRow).join('')}</div>
    ` : ''}

    ${filmo.writing.length ? `
      ${secHead('03', 'Scenaristički radovi', filmo.writing.length + ' ' + pluralNaslov(filmo.writing.length))}
      <div class="rows">${filmo.writing.map(simpleRow).join('')}</div>
    ` : ''}
  `;
}

   12. TITLE DETAIL

        <div class="season-tile-sub">${eps.length} ${pluralEpizoda(eps.length)}</div>

function castTileHtml(c, title, isSeries){
  const p = getPerson(c.personId);
  if (!p) return '';
  const epCount = isSeries ? computeCastEpisodes(c, title) : 0;
  const epHtml = (isSeries && epCount > 0)
    ? `<div class="cast-tile-episodes">${epCount} ${pluralEpizoda(epCount)}</div>`
    : '';
  const charText = c.character ? 'kao ' + esc(c.character) : 'uloga nije navedena';
  return `
    <div class="cast-tile">
      <div class="cast-portrait" data-img-key="person_${p.id}" style="--h:${hueFor(p.name)}">

      </div>
      <div class="cast-tile-body">
        <a class="cast-tile-name" href="#/person/${p.id}">${esc(p.name)}</a>
        <div class="cast-tile-char">${charText}</div>
        ${epHtml}
      </div>
      <button class="btn bare cast-tile-remove" data-action="credit-remove" data-title="${title.id}" data-person="${p.id}" title="Ukloni ulogu">&#10005;</button>

  `;
}

function castGridHtml(list, title, isSeries){
  return `<div class="cast-grid">${list.map(c => castTileHtml(c, title, isSeries)).join('')}</div>`;
}

function viewTitle(id){
  const t = getTitle(id);
  if (!t) return notFound('Naslov nije pronađen', 'Traženi film ili serija ne postoji u arhivi.');

  const isSeries = t.type === 'series';

  let cast = (t.cast || []).map(c => Object.assign({}, c));
  if (isSeries){
    cast.forEach(c => { c._episodes = computeCastEpisodes(c, t); });
    cast.sort((a, b) => (b._episodes || 0) - (a._episodes || 0));
  }

  /* NEW: Limit is 8 for movies, 20 for series */
  const VISIBLE_CAST_LIMIT = isSeries ? 20 : 8;
  let visibleCast, hiddenCast;
  if (cast.length > VISIBLE_CAST_LIMIT){
    visibleCast = cast.slice(0, VISIBLE_CAST_LIMIT);
    hiddenCast = cast.slice(VISIBLE_CAST_LIMIT);
  } else {
    visibleCast = cast;
    hiddenCast = [];
  }
  const isExpanded = expandedCastTitles.has(String(t.id));

  const facts = [];
  facts.push(`<div class="fact"><dt>${t.type === 'film' ? 'Godina' : 'Period'}</dt><dd>${esc(yearsLabel(t))}</dd></div>`);
  if (t.type === 'film' && t.runtime) facts.push(`<div class="fact"><dt>Trajanje</dt><dd>${esc(t.runtime)} min</dd></div>`);
  if (isSeries) {
    const totalEps = (t.seasons || []).reduce((sum, s) => sum + (s.episodes || []).length, 0);
    if (totalEps > 0) facts.push(`<div class="fact"><dt>Ukupno epizoda</dt><dd>${totalEps}</dd></div>`);
  }
  if (t.rating) facts.push(`<div class="fact"><dt>Ocena</dt><dd>&#9733; ${Number(t.rating).toFixed(1)}</dd></div>`);

  const directorNames = (t.directors || []).map(pid => {
    const p = getPerson(pid);
    return p ? `<a href="#/person/${p.id}">${esc(p.name)}</a>` : null;
  }).filter(Boolean);

  const screenwriterNames = (t.screenwriters || []).map(pid => {
    const p = getPerson(pid);
    return p ? `<a href="#/person/${p.id}">${esc(p.name)}</a>` : null;
  }).filter(Boolean);

  const crewHtml = `

function viewSearch(query){
  const q = String(query || '').trim().toLowerCase();
  let titles = [], people = [];
  if (q){
    titles = db.titles.filter(t => {
      const directorsNames = (t.directors||[]).map(id => getPerson(id)?.name || '').join(' ');
      const screenwritersNames = (t.screenwriters||[]).map(id => getPerson(id)?.name || '').join(' ');
      const castNames = (t.cast||[]).map(c => getPerson(c.personId)?.name || '').join(' ');
      return [t.title, directorsNames, screenwritersNames, castNames, (t.genres||[]).join(' '), t.synopsis]
        .join(' ').toLowerCase().indexOf(q) !== -1;
    });
    people = db.people.filter(p =>
      (p.name + ' ' + (p.birthPlace||'') + ' ' + (p.bio||'') + ' ' + (p.occupations||[]).join(' '))
        .toLowerCase().indexOf(q) !== -1);
  }
  return `
    <div class="page-head">
      <div><h1>Rezultati pretrage</h1><div class="sub">Pojam: <b>${esc(query || '—')}</b></div></div>
      <a class="btn" href="#/">Nazad</a>
    </div>
    ${secHead('01', 'Naslovi', titles.length + ' ' + pluralNaslov(titles.length))}
    ${titles.length ? `<div class="grid">${titles.map(titleCard).join('')}</div>`
      : emptyBlock('&#9671;', 'Nema pronađenih naslova', 'Pokušajte sa drugim pojmom.')}
    ${secHead('02', 'Osobe', people.length + ' ' + pluralOsoba(people.length))}
    ${people.length ? `<div class="grid people">${people.map(personCard).join('')}</div>`
      : emptyBlock('&#9671;', 'Nema pronađenih osoba', 'Pokušajte sa drugim imenom.')}
  `;
}

function viewStats(){
  const films  = db.titles.filter(t => t.type === 'film');
  const series = db.titles.filter(t => t.type === 'series');
  const roles  = db.titles.reduce((s,t) => s + (t.cast ? t.cast.length : 0), 0);
  const episodesCount = series.reduce((sum, s) => sum + (s.seasons||[]).reduce((x, se) => x + (se.episodes||[]).length, 0), 0);

  const rated = db.titles.filter(t => t.rating > 0);
  const avg = rated.length ? (rated.reduce((s,t) => s + Number(t.rating), 0) / rated.length) : 0;

  db.titles.forEach(t => (t.genres||[]).forEach(g => { gCount[g] = (gCount[g]||0) + 1; }));

          <div class="ledger-row">
            <div>
              <div class="l-name">${esc(g.name)}</div>
              <div class="gbar"><i style="width:${Math.max(5, Math.round(g.n / gMax * 100))}%"></i></div>

   16. MODAL
   ============================================================ */
function showModal(opts){
  const root = document.getElementById('modalRoot');
  root.innerHTML = `
    <div class="modal-backdrop" data-backdrop>
      <div class="modal" role="dialog" aria-modal="true">
        <div class="modal-head">
          <h2>${esc(opts.title)}</h2>
          <button type="button" class="modal-x" data-close aria-label="Zatvori">&#10005;</button>
        </div>
        <form id="modalForm" novalidate>
          <div class="modal-body">${opts.body}</div>
          <div class="modal-foot">
            <button type="button" class="btn" data-close>Otkaži</button>
            <button type="submit" class="btn solid">${esc(opts.submitLabel || 'Sačuvaj')}</button>
          </div>
        </form>
      </div>
    </div>`;
  root.classList.add('open');

  root.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', closeModal));
  
  // Outside click disabled to prevent accidental loss of progress.
  /*
  const backdrop = root.querySelector('[data-backdrop]');
  backdrop.addEventListener('click', e => { if (e.target === backdrop) closeModal(); });
  */

  const form = document.getElementById('modalForm');
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = form.querySelector('button[type=submit]');
    if (btn.disabled) return;
    btn.disabled = true;
    try{ await opts.onSubmit(form); }
    catch(err){ console.error(err); toast('Greška: ' + (err && err.message ? err.message : 'nepoznato'), 'error'); }
    finally{ btn.disabled = false; }
  });

  if (opts.onReady) opts.onReady(form);
  const first = form.querySelector('input, select, textarea');
  if (first) setTimeout(() => first.focus(), 60);
}
function closeModal(){
  const root = document.getElementById('modalRoot');
  root.classList.remove('open');
  root.innerHTML = '';
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

function imagePickerMarkup(key, kind){
  const cls = kind === 'poster' ? 'img-preview poster' : 'img-preview';
  return `
    <div class="img-field">
      <span class="lab">Slika</span>
      <div class="img-picker">
        <div class="${cls}" id="imgPreview" ${key ? `data-preview-key="${key}"` : ''}></div>
        <div class="img-picker-actions">
          <button type="button" class="btn tiny" id="imgPick">Izaberi sliku</button>
          <button type="button" class="btn tiny outline-red" id="imgClear">Ukloni sliku</button>
          <div class="hint">Automatski se kompresuje u WebP (~40-60KB).</div>
        </div>
      </div>
      <input type="file" id="imgFile" accept="image/*" hidden>
    </div>`;
}

function bindImagePicker(pending){
  const preview = document.getElementById('imgPreview');
  const pickBtn = document.getElementById('imgPick');
  const clearBtn = document.getElementById('imgClear');
  const fileInput = document.getElementById('imgFile');
  if (!preview || !pickBtn || !clearBtn || !fileInput) return;

  const isPoster = preview.classList.contains('poster');
  const opts = isPoster
    ? { maxDim: 480, quality: 0.74, targetKB: 60 }
    : { maxDim: 400, quality: 0.72, targetKB: 45 };

  if (pending.initialKey){
    getImageURL(pending.initialKey).then(url => {
      if (!url) return;
      preview.style.backgroundImage = `url("${url}")`;
      preview.classList.add('has-img');
    });
  }

  pickBtn.addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', async (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    if (file.size > 20 * 1024 * 1024){
      toast('Slika je prevelika (>20MB). Izaberite manju.', 'error');
      fileInput.value = '';
      return;
    }
    try{
      const blob = await compressImage(file, opts);
      pending.current = blob;
      pending.removed = false;
      if (pending.previewURL){ try{ URL.revokeObjectURL(pending.previewURL); }catch(err){} }
      pending.previewURL = URL.createObjectURL(blob);
      preview.style.backgroundImage = `url("${pending.previewURL}")`;
      preview.classList.add('has-img');
      const ratio = Math.max(0, Math.round((1 - blob.size / file.size) * 100));
      toast('Slika: ' + fmtBytes(file.size) + ' → ' + fmtBytes(blob.size) + ' (-' + ratio + '%)', 'info');
    }catch(err){
      toast(err.message || 'Ne mogu da obradim sliku', 'error');
    }
    fileInput.value = '';
  });
  clearBtn.addEventListener('click', () => {
    pending.current = null;
    pending.removed = true;
    if (pending.previewURL){ try{ URL.revokeObjectURL(pending.previewURL); }catch(err){} pending.previewURL = null; }
    preview.style.backgroundImage = '';
    preview.classList.remove('has-img');
  });
}

async function applyPendingImageToKey(pending, key){
  try{
    if (pending.removed){ await deleteImage(key); invalidateImageURL(key); return; }
    if (pending.current){
      await putImage(key, pending.current);
      invalidateImageURL(key);
      await refreshKnownImageKeys();
    }
  }catch(err){
    console.error(err);
    if (err && (err.name === 'QuotaExceededError' || /quota/i.test(String(err.message || '')))){
      toast('Nema dovoljno prostora za sliku.', 'error');
    } else {
      toast('Slika nije sačuvana: ' + (err && err.message ? err.message : 'greška'), 'error');
    }
    throw err;
  }
}

function bindCastEditor(form, isSeries){
  const editor = form.querySelector('[data-cast]');
  const addBtn = form.querySelector('[data-add-cast]');
  if (!editor || !addBtn) return;

  addBtn.addEventListener('click', () => {
    const tmp = document.createElement('div');
    tmp.innerHTML = castRowMarkup('', '', '', [], null, isSeries).trim();
    editor.appendChild(tmp.firstChild);
  });

  editor.addEventListener('click', e => {
    const btn = e.target.closest('[data-remove-cast]');
    if (!btn) return;
    const row = btn.closest('[data-cast-item]');
    if (row) row.remove();
  });
}

function readCast(form){
  const items = [...form.querySelectorAll('[data-cast-item]')];
  return items.map(item => {
    const seasonsEl = item.querySelector('.cast-seasons');
    const episodesEl = item.querySelector('.cast-episodes');
    const seasons = seasonsEl ? parseSeasons(seasonsEl.value) : [];
    let totalEpisodes = null;
    if (episodesEl){
      const raw = episodesEl.value.trim();
      if (raw !== ''){
        const n = parseInt(raw, 10);
        if (!isNaN(n) && n >= 0) totalEpisodes = n;
      }
    }
    const roleEl = item.querySelector('.cast-role');
    return {
      name: (item.querySelector('.cast-name').value || '').trim(),
      character: (item.querySelector('.cast-character').value || '').trim(),
      role: roleEl ? (roleEl.value || '') : '',
      seasons,
      totalEpisodes
    };
  }).filter(c => c.name);
}

function bindSeasonsEditor(form){

  const addSeasonBtn = form.querySelector('[data-add-season]');

  addSeasonBtn.addEventListener('click', () => {

    editor.appendChild(tmp.firstChild);
  });

  editor.addEventListener('click', e => {

    if (addEp){
      const block = addEp.closest('[data-season]');
      const list = block.querySelector('[data-episodes]');
      const count = list.querySelectorAll('[data-episode]').length;
      const tmp = document.createElement('div');
      tmp.innerHTML = episodeRowMarkup(count + 1, '', '').trim();
      list.appendChild(tmp.firstChild);
      return;
    }
    const rmSeason = e.target.closest('[data-remove-season]');

      const block = rmSeason.closest('[data-season]');
      if (window.confirm('Ukloniti ovu sezonu i sve njene epizode?')) block.remove();
      return;
    }
    const rmEp = e.target.closest('[data-remove-episode]');
    if (rmEp){
      const row = rmEp.closest('[data-episode]');
      if (row) row.remove();
    }
  });
}

function readSeasons(form){
  const seasons = [];
  form.querySelectorAll('[data-season]').forEach(sEl => {
    const number = Number(sEl.querySelector('.season-num').value) || 1;
    const episodes = [];
    sEl.querySelectorAll('[data-episode]').forEach(eEl => {
      episodes.push({
        number: Number(eEl.querySelector('.ep-num').value) || 1,
        title: (eEl.querySelector('.ep-title').value || '').trim(),
        airdate: eEl.querySelector('.ep-airdate').value || ''
      });
    });
    seasons.push({ number, episodes });
  });
  return seasons;
}

    async onSubmit(form){
      const d = new FormData(form);
      let name = String(d.get('name') || '').trim();
      if (!name){ toast('Ime je obavezno', 'error'); return; }

      const isDuplicate = db.people.some(x => x.id !== (p ? p.id : null) && x.name.toLowerCase() === name.toLowerCase());
      
      if (isDuplicate) {
        const choice = await promptDuplicateChoice(name);
        if (choice === 'existing') {
          const existing = db.people.find(x => x.name.toLowerCase() === name.toLowerCase());
          closeModal();
          go('/person/' + existing.id);
          toast('Preusmereni ste na postojeću osobu.', 'info');
          return; 
        } else {
          let counter = 1;
          let uniqueName = name;
          while (db.people.some(x => x.name.toLowerCase() === uniqueName.toLowerCase())) {
            counter++;
            uniqueName = name + ' (' + counter + ')';
          }
          name = uniqueName;
        }
      }

      const occupations = [...form.querySelectorAll('input[name=occ]:checked')].map(c => c.value);

      let targetId;
      if (p){
        p.name = name;
        p.birthDate = String(d.get('birthDate') || '').trim();
        p.birthPlace = String(d.get('birthPlace') || '').trim();
        p.deathDate = String(d.get('deathDate') || '').trim();
        p.deathPlace = String(d.get('deathPlace') || '').trim();
        p.occupations = occupations;
        p.bio = String(d.get('bio') || '').trim();
        targetId = p.id;
      } else {
        const newP = {
          id: db.meta.nextPersonId++,
          name,
          birthDate: String(d.get('birthDate') || '').trim(),
          birthPlace: String(d.get('birthPlace') || '').trim(),
          deathDate: String(d.get('deathDate') || '').trim(),
          deathPlace: String(d.get('deathPlace') || '').trim(),
          occupations, bio: String(d.get('bio') || '').trim()
        };
        db.people.push(newP);
        targetId = newP.id;
      }

      const textSaved = await saveDB();
      try{ await applyPendingImageToKey(pending, 'person_' + targetId); }catch(err){}

      if (textSaved){
        toast(p ? 'Osoba je ažurirana' : 'Osoba je dodata');
      } else {
        toast('Podaci nisu sačuvani. Napravite IZVOZ!', 'error');
      }
      if (pending.previewURL) try{ URL.revokeObjectURL(pending.previewURL); }catch(e){}
      closeModal();
      render();
    }
  });
}

      const seasons = isSeries ? readSeasons(form) : [];

      const payload = {
        type, title: name, year,
        endYear: isSeries ? String(d.get('endYear') || '').trim() : '',

        targetId = t.id;

        db.titles.push(newT);
        targetId = newT.id;
      }

      const textSaved = await saveDB();

      try{ await applyPendingImageToKey(pending, 'title_' + targetId); }catch(err){}

        toast('Podaci nisu sačuvani. Napravite IZVOZ!', 'error');

        toast('Kreirano ' + created.length + ' novih osoba.', 'info');

        toast(t ? 'Naslov je ažuriran' : 'Naslov je dodat');
      }

      if (pending.previewURL) try{ URL.revokeObjectURL(pending.previewURL); }catch(e){}

      render();

/* ============================================================
   24. IMPORT / EXPORT / CLEAR
   ============================================================ */
function blobToBase64(blob){
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result);
    r.onerror = () => rej(r.error);
    r.readAsDataURL(blob);
  });
}
function base64ToBlob(dataURL){
  return new Promise((res, rej) => {
    try{
      const [meta, b64] = dataURL.split(',');
      const mime = (meta.match(/data:([^;]+);/) || [])[1] || 'image/jpeg';
      const bin = atob(b64);
      const arr = new Uint8Array(bin.length);
      for (let i=0;i<bin.length;i++) arr[i] = bin.charCodeAt(i);
      res(new Blob([arr], { type: mime }));
    }catch(e){ rej(e); }
  });
}

async function exportDatabase(){
  try{
    toast('Pripremam izvoz…', 'info');
    const images = {};
    const keys = await getImageKeys();
    for (const key of keys){
      const blob = await getImage(key);
      if (blob){
        try{ images[key] = await blobToBase64(blob); }catch(e){}
      }
    }
    const payload = { data: db, images, exportedAt: new Date().toISOString(), formatVersion: 4 };
    const json = JSON.stringify(payload);
    const blob = new Blob([json], { type: 'application/json' });
    if (blob.size > 20 * 1024 * 1024){
      if (!window.confirm('Fajl je velik (' + fmtBytes(blob.size) + '). Nastaviti?')) return;
    }
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'srpska-filmska-baza-' + new Date().toISOString().slice(0,10) + '.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    toast('Baza je izvezena (' + fmtBytes(blob.size) + ')');
  }catch(err){
    console.error(err);
    toast('Greška pri izvozu: ' + (err && err.message ? err.message : 'nepoznato'), 'error');
  }
}

async function importDatabase(file){
  const reader = new FileReader();
  reader.onload = async (ev) => {
    try{
      const parsed = JSON.parse(ev.target.result);
      let dataPart, imagesPart = null;
      if (parsed && parsed.data && Array.isArray(parsed.data.people) && Array.isArray(parsed.data.titles)){
        dataPart = parsed.data; imagesPart = parsed.images || null;
      } else if (parsed && Array.isArray(parsed.people) && Array.isArray(parsed.titles)){
        dataPart = parsed;
      } else {
        toast('Neispravan format fajla', 'error'); return;
      }

      if (!dataPart.people.length && !dataPart.titles.length){
        if (!window.confirm('Uvezeni fajl ne sadrži podatke. Obrisati sve postojeće?')) return;
      }

      db = dataPart;
      normalizeDBMeta();
      const textSaved = await saveDBForce();

      await clearAllImages();
      imageURLs.forEach(e => { try{ URL.revokeObjectURL(e.url); }catch(err){} });
      imageURLs.clear();
      knownImageKeys = new Set();

      if (imagesPart){
        let restored = 0, failed = 0;
        for (const key of Object.keys(imagesPart)){
          try{
            const blob = await base64ToBlob(imagesPart[key]);
            await putImage(key, blob);
            restored++;
          }catch(e){ failed++; console.warn('Image import failed', key, e); }
        }
        await refreshKnownImageKeys();
        toast('Baza je uvezena. Slika: ' + restored + (failed ? ' (greške: ' + failed + ')' : ''));
      } else {
        toast(textSaved ? 'Baza je uvezena (bez slika)' : 'Baza nije sačuvana!', textSaved ? undefined : 'error');
      }
      go('/');
    }catch(err){
      console.error(err);
      toast('Greška pri čitanju: ' + (err && err.message ? err.message : 'nepoznato'), 'error');
    }
  };
  reader.readAsText(file);
}

async function recoverFromLegacyStorage(){
  const found = readLegacyTextFromLocalStorage();
  if (!found){
    toast('Nema podataka u starom skladištu.', 'error');
    return;
  }
  const count = found.data.people.length + found.data.titles.length;
  if (!window.confirm(`Pronađeno ${count} zapisa u starom skladištu. Uvesti ih? Trenutni podaci biće prepisani.`)) return;

  db = found.data;
  normalizeDBMeta();
  const ok = await saveDBForce();
  if (ok){
    await cleanupLegacyStorage();
    await refreshKnownImageKeys();
    toast('Podaci su uvezeni iz starog skladišta.');
    go('/');
  } else {
    toast('Uvoz nije uspeo. Napravite IZVOZ!', 'error');
  }
}

async function clearDatabase(){
  if (!window.confirm('Obrisati SVE podatke i slike? Ne može se poništiti.')) return;
  db = { people: [], titles: [], meta: { nextPersonId: 1, nextTitleId: 1, version: 4 } };
  await saveDBForce();
  try{
    await clearAllImages();
    imageURLs.forEach(e => { try{ URL.revokeObjectURL(e.url); }catch(err){} });
    imageURLs.clear();
    knownImageKeys = new Set();
  }catch(e){}
  toast('Baza je obrisana');
  go('/');
}

  const ps = document.getElementById('peopleSort');
  if (pq) pq.addEventListener('input', e => { ui.people.query = e.target.value; renderPeopleGrid(); });
  if (ps) ps.addEventListener('change', e => { ui.people.sort = e.target.value; renderPeopleGrid(); });
  if (pq || ps) renderPeopleGrid();
}

document.addEventListener('click', function(e){
  const tile = e.target.closest('.season-tile');
  if (tile){
    const grid = tile.closest('.seasons-grid');
    if (grid){
      e.preventDefault();
      e.stopPropagation();
      const wasExpanded = tile.classList.contains('expanded');
      grid.querySelectorAll('.season-tile').forEach(t => {
        t.classList.remove('expanded', 'hidden-tile');
      });
      if (!wasExpanded){
        tile.classList.add('expanded');
        grid.querySelectorAll('.season-tile').forEach(t => {
          if (t !== tile) t.classList.add('hidden-tile');
        });
      }
      return;
    }
  }

  const link = e.target.closest('a[href^="#/"]');
  if (link){
    e.preventDefault();
    go(link.getAttribute('href').slice(1));
    return;
  }
  const el = e.target.closest('[data-action]');
  if (!el) return;
  e.preventDefault();
  const action = el.dataset.action;
  const id = el.dataset.id;
  switch(action){
    case 'title-new':        openTitleForm(null, el.dataset.type || 'film'); break;
    case 'person-new':       openPersonForm(null); break;
    case 'title-edit':       openTitleForm(Number(id)); break;
    case 'person-edit':      openPersonForm(Number(id)); break;
    case 'title-delete':     deleteTitle(Number(id)); break;
    case 'person-delete':    deletePerson(Number(id)); break;
    case 'credit-add-title': openCreditForm(Number(id)); break;
    case 'credit-add-person':openCreditForPerson(Number(id)); break;
    case 'credit-remove':    removeCredit(Number(el.dataset.title), Number(el.dataset.person)); break;
    case 'export':           exportDatabase(); break;
    case 'import':           document.getElementById('importFile').click(); break;
    case 'recover-legacy':   recoverFromLegacyStorage(); break;
    case 'clear':            clearDatabase(); break;
    case 'cast-toggle': {
      const wrap = document.getElementById('castMore');
      if (!wrap) break;
      const titleId = String(currentRoute.segments[1] || '');
      const hiddenCount = el.dataset.hiddenCount || '';
      const currentlyHidden = (wrap.style.display === 'none' || !wrap.style.display);
      if (currentlyHidden){
        wrap.style.display = 'block';
        el.textContent = 'Sakrij (' + hiddenCount + ') ↑';
        expandedCastTitles.add(titleId);
      } else {
        wrap.style.display = 'none';
        el.textContent = 'Prikaži sve (' + hiddenCount + ') ↓';
        expandedCastTitles.delete(titleId);
      }
      break;
    }
  }
});

function bindGlobalSearch(){
  const form = document.getElementById('globalSearchForm');
  const input = document.getElementById('globalSearchInput');
  form.addEventListener('submit', e => {
    e.preventDefault();
    const q = input.value.trim();
    if (q) go('/search?q=' + encodeURIComponent(q));
  });
}

function bindImport(){
  const input = document.getElementById('importFile');
  input.addEventListener('change', e => {
    const f = e.target.files && e.target.files[0];
    if (f) importDatabase(f);
    e.target.value = '';
  });
}

/* ============================================================
   26. BOOT — single straightforward flow
   ============================================================ */
async function boot(){
  try{ saveStatusEl = document.getElementById('saveStatus'); }catch(e){}

  /* Step 1: try to load from the new single IndexedDB */
  let loaded = await loadFromPrimary();

  /* Step 2: if nothing and migration hasn't been attempted, try to migrate */
  if (!loaded && !(await migrationAlreadyDone())){
    const legacy = readLegacyTextFromLocalStorage();
    if (legacy){
      db = legacy.data;
      normalizeDBMeta();
      const saved = await saveDBForce();
      if (saved){
        await migrateLegacyImages();
        await markMigrationDone();
        await cleanupLegacyStorage();
        try{ await refreshKnownImageKeys(); }catch(e){}
        setTimeout(() => {
          showPersistentBanner(
            'Podaci su automatski premešteni u novo, jednostavnije skladište (IndexedDB). Sve je u redu.',
            'info'
          );
        }, 400);
        loaded = db;
      } else {
        /* Save failed — do NOT clear old storage */
        showPersistentBanner(
          'Migracija nije uspela. Napravite IZVOZ što pre, pa pokušajte ponovo.',
          'error'
        );
        loaded = db; /* still load in memory so user can export */
      }
    } else {
      /* No legacy data — mark as done so we don't keep checking */
      await markMigrationDone();
    }
  }

  /* Step 3: fall back to empty DB if nothing loaded */
  if (loaded){
    db = loaded;
    normalizeDBMeta();
  } else if (!db.titles.length && !db.people.length){
    db = { people: [], titles: [], meta: { nextPersonId: 1, nextTitleId: 1, version: 4 } };
  }

  bindGlobalSearch();
  bindImport();
  try{ await refreshKnownImageKeys(); }catch(e){}
  setSaveStatus('ok');
  const initial = location.hash.replace(/^#/, '') || '/';
  lastPath = null;
  renderPath(initial);
}

document.addEventListener('DOMContentLoaded', boot);
</script>
